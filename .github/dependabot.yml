version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /examples/wxt
    schedule:
      interval: weekly
    groups:
      wxt-example-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /examples/plasmo
    schedule:
      interval: weekly
    groups:
      plasmo-example-dependencies:
        patterns: ["*"]
