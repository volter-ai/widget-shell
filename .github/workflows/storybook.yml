name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: storybook-nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run storybook:build

  framework-compatibility:
    name: ${{ matrix.framework }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        framework: [wxt, plasmo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/${{ matrix.framework }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack the consumer artifact
        run: |
          mkdir -p "$RUNNER_TEMP/widget-shell-package"
          npm pack --pack-destination "$RUNNER_TEMP/widget-shell-package"
          echo "WIDGET_SHELL_TARBALL=$(find "$RUNNER_TEMP/widget-shell-package" -name '*.tgz' -print -quit)" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
        working-directory: examples/${{ matrix.framework }}
      - name: Install Widget Shell as a consumer
        run: npm install --no-save --package-lock=false --ignore-scripts "$WIDGET_SHELL_TARBALL"
        working-directory: examples/${{ matrix.framework }}
      - run: npm run build
        working-directory: examples/${{ matrix.framework }}
      - if: matrix.framework == 'wxt'
        run: npm run build:firefox
        working-directory: examples/wxt
      - run: npm audit --omit=dev --audit-level=low
        working-directory: examples/${{ matrix.framework }}
